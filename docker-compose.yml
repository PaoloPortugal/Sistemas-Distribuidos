services:
  gateway:
    image: traefik:v3.6
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - "${PUERTO_GATEWAY:-8080}:80"
      - "8081:8080"
    volumes:
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"

  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PUERTO_POSTGRES:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CONTRASENA}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  usuarios:
    build: ./servicios/usuarios
    # Sin env_file: el contenedor recibe solo sus propias variables.
    environment:
      NOMBRE_SERVICIO: usuarios
      URL_BASE_DATOS: postgresql+psycopg://${USUARIOS_DB_USUARIO}:${USUARIOS_DB_CONTRASENA}@postgres:5432/${POSTGRES_DB}
      UVICORN_ROOT_PATH: /api/usuarios
      RUTA_CLAVE_PRIVADA_JWT: /run/secrets/jwt_privada.pem
      RUTA_CLAVE_PUBLICA_JWT: /run/secrets/jwt_publica.pem
      URL_CATALOGO: http://catalogo-medicos:8002
    # Único servicio con la clave privada: es el que firma los tokens.
    secrets:
      - source: jwt_privada
        target: jwt_privada.pem
      - source: jwt_publica
        target: jwt_publica.pem
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usuarios.rule=PathPrefix(`/api/usuarios`)"
      - "traefik.http.middlewares.usuarios-prefijo.stripprefix.prefixes=/api/usuarios"
      - "traefik.http.routers.usuarios.middlewares=usuarios-prefijo"
      - "traefik.http.services.usuarios.loadbalancer.server.port=8001"

  catalogo-medicos:
    build: ./servicios/catalogo_medicos
    # Sin env_file: el contenedor recibe solo sus propias variables.
    environment:
      NOMBRE_SERVICIO: catalogo_medicos
      URL_BASE_DATOS: postgresql+psycopg://${CATALOGO_MEDICOS_DB_USUARIO}:${CATALOGO_MEDICOS_DB_CONTRASENA}@postgres:5432/${POSTGRES_DB}
      UVICORN_ROOT_PATH: /api/catalogo-medicos
      RUTA_CLAVE_PUBLICA_JWT: /run/secrets/jwt_publica.pem
      # "Hoy" para rechazar franjas en el pasado y para los rangos por defecto.
      ZONA_HORARIA: America/Montevideo
    secrets:
      - source: jwt_publica
        target: jwt_publica.pem
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # /interno es solo para otros servicios (red interna): Traefik no lo publica.
      - "traefik.http.routers.catalogo-medicos.rule=PathPrefix(`/api/catalogo-medicos`) && !PathPrefix(`/api/catalogo-medicos/interno`)"
      - "traefik.http.middlewares.catalogo-medicos-prefijo.stripprefix.prefixes=/api/catalogo-medicos"
      - "traefik.http.routers.catalogo-medicos.middlewares=catalogo-medicos-prefijo"
      - "traefik.http.services.catalogo-medicos.loadbalancer.server.port=8002"

  reservas:
    build: ./servicios/reservas
    # Sin env_file: el contenedor recibe solo sus propias variables.
    environment:
      NOMBRE_SERVICIO: reservas
      URL_BASE_DATOS: postgresql+psycopg://${RESERVAS_DB_USUARIO}:${RESERVAS_DB_CONTRASENA}@postgres:5432/${POSTGRES_DB}
      # Todavía sin uso: el publicador del outbox va en la próxima etapa (ADR 005).
      URL_RABBITMQ: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CONTRASENA}@rabbitmq:5672/
      URL_CATALOGO: http://catalogo-medicos:8002
      UVICORN_ROOT_PATH: /api/reservas
      RUTA_CLAVE_PUBLICA_JWT: /run/secrets/jwt_publica.pem
      # "Hoy" y el inicio de los turnos para los plazos de cancelación.
      ZONA_HORARIA: America/Montevideo
    secrets:
      - source: jwt_publica
        target: jwt_publica.pem
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reservas.rule=PathPrefix(`/api/reservas`)"
      - "traefik.http.middlewares.reservas-prefijo.stripprefix.prefixes=/api/reservas"
      - "traefik.http.routers.reservas.middlewares=reservas-prefijo"
      - "traefik.http.services.reservas.loadbalancer.server.port=8003"

  notificaciones:
    build: ./servicios/notificaciones
    env_file: .env
    environment:
      NOMBRE_SERVICIO: notificaciones
      URL_BASE_DATOS: postgresql+psycopg://${NOTIFICACIONES_DB_USUARIO}:${NOTIFICACIONES_DB_CONTRASENA}@postgres:5432/${POSTGRES_DB}
      URL_RABBITMQ: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CONTRASENA}@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PUERTO: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  datos_postgres:

# Claves JWT de desarrollo: se generan con infra/claves/generar_claves.sh
# y no se suben al repositorio.
secrets:
  jwt_privada:
    file: ./secretos/jwt_privada.pem
  jwt_publica:
    file: ./secretos/jwt_publica.pem
